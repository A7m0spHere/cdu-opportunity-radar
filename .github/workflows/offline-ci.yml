name: Offline CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned packaging tools
        run: python -m pip install -r requirements-build.txt
      - name: Install development dependencies
        run: python -m pip install -c requirements-lock.txt -e ".[dev]"
      - name: Verify dependency and TLS environment
        run: python scripts/verify_security_environment.py --require-lock --output security-environment.json
      - name: Offline regression suite (mock sources and loopback only)
        run: python -m pytest -q
      - name: Build and install wheel
        shell: bash
        run: |
          python -m pip wheel . --no-deps --wheel-dir artifacts/ci-wheel
          python -m pip install --force-reinstall --no-deps artifacts/ci-wheel/*.whl
      - name: Verify installed CLI and packaged assets
        run: python -I scripts/ci_smoke.py
