[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cdu-opportunity-radar"
version = "0.2.0rc4"
description = "CDU official campus notice aggregation with a student web page and automatic RSS"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.28,<0.29", "beautifulsoup4>=4.14,<5", "certifi>=2026.10.19"]

[project.urls]
Homepage = "https://github.com/A7m0spHere/cdu-opportunity-radar"
Repository = "https://github.com/A7m0spHere/cdu-opportunity-radar"
Issues = "https://github.com/A7m0spHere/cdu-opportunity-radar/issues"
Documentation = "https://github.com/A7m0spHere/cdu-opportunity-radar/blob/main/docs/STUDENT_PAGE.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "feedparser>=6,<7", "PyYAML>=6,<7"]

[project.scripts]
cdu-radar = "cdu_radar.cli:main"

[tool.setuptools.packages.find]
include = ["cdu_radar*"]

[tool.setuptools.package-data]
cdu_radar = ["sources.json", "units.json", "rules.json", "web/*.html", "web/*.css", "web/*.js", "web/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
