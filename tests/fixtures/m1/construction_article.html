<!doctype html><html><head><meta charset="utf-8"></head><body><form name="_newscontent_fromname"><div class="conth1">金秋聚力启新篇 活动赋能绽光彩  —— 箭竹工作室 9-10 月师生活动掠影</div><div>日期：2025-11-18</div><div id="vsb_content"><p style="text-indent:32px"><span style="font-family:微软雅黑;font-size:16px"><span style="font-family:微软雅黑">为了助力建筑与土木工程专业学子打通</span> <span style="font-family:微软雅黑">“学涯 - 职涯 – 生涯” 衔接通道，深化对行业发展的认知，同时进一步强化学生工作队伍建设，提升骨干老师生涯咨询与就业指导能力，建筑与土木工程学院箭竹工作室经过精心筹备，于 2025 年 9-10 月集中开展学生职业赋能与教师素质提升专项活动。</span></span></p></div></form></body></html>
