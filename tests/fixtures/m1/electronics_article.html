<!doctype html><html><head><meta charset="utf-8"></head><body><form name="_newscontent_fromname"><div class="content-title"><h4>我校在第21届全国大学生智能汽车竞赛中斩获2项全国一等奖 创历史最佳</h4></div><div>时间：2026年09月03日</div><div id="vsb_content"><p style="text-indent:32px;text-autospace:ideograph-numeric"><span style="font-family:微软雅黑;font-size:16px">（</span><span style="font-family:微软雅黑;font-size:16px"><span style="font-family:微软雅黑">图、文</span><span style="font-family:微软雅黑"></span></span><span style="font-family:微软雅黑;font-size:16px"><span style="font-family:微软雅黑">）近日，第二十一届全国大学生智能汽车竞赛全国总决赛在安徽大学落幕。我校智能汽车竞赛团队斩获国家级一等奖</span><span style="font-family:微软雅黑">2项、国家级二等奖1项，获奖数量与质量均创我校参赛以来历史最佳纪录，实现历史性突破。</span></span></p></div></form></body></html>
