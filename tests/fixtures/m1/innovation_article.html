<!doctype html><html><head><meta charset="utf-8"></head><body><form name="_newscontent_fromname"><h3>【学科竞赛】关于举办2026新锐设计竞赛·华灿奖的通知</h3><div>发布时间： 2026-09-21</div><div id="vsb_content"><p style="line-height: 2em; text-align: justify;"><span style='font-family: 微软雅黑, "Microsoft YaHei"; font-size: 16px;'>       2026新锐设计竞赛·华灿奖由中国高等教育学会、中华中山文化交流协会主办，民革中央联络部、中国高等教育学会设计教育专业委员会承办，是面向内地（大陆）及港澳台地区、海外华人青年设计师的设计类竞赛。赛事以“融·合”为主题，以赛促育、以赛促融、以赛促创，搭建海内外青年设计人才竞技展示平台，深化内地（大陆）及港澳台地区、海外华人青年文化交流，推动创意设计、数字技术与新材料创新落地转化，已经成功举办十届，是两岸及海内外青年设计交流的重要赛事。</span></p></div></form></body></html>
