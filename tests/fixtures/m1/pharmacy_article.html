<!doctype html><html><head><meta charset="utf-8"></head><body><form name="_newscontent_fromname"><h2 class="tit">我院第十三届“开拓杯”评审圆满落幕</h2><div>发布时间：2026-01-05</div><div id="vsb_content_2"><p class="vsbcontent_start">近日，第十三届“开拓杯”成都大学大学生创业计划竞赛院级比赛工作顺利完成。本次比赛主要通过线上评审方式进行，专家组从项目成熟度、创新性等维度对参赛项目进行了全面评估，共有22个项目参与本次评审，其中“绿色赋能——穿心莲非药用资源向动物饲料转化新途径”和“麻到成功—天麻高压饮片的开发与成果转化”等多个项目凭借其显著优势获得评委一致认可。</p></div></form></body></html>
