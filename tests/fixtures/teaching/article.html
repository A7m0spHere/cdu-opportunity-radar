<!doctype html><html><head><meta charset="utf-8"></head><body><form name="_newscontent_fromname"><div class="art-tit cont-tit">
<h3>关于做好2026级新生学籍信息网上查询核对工作的通知</h3>
<p class="xxly"><span>发布时间：2026-10-15</span></p></div><div id="vsb_content"><p style="margin-top:0;margin-bottom:0;vertical-align:baseline;background:rgb(255,255,255)"><span style="font-family:'times new roman';color:rgb(88,88,88);font-size:21px"><span style="font-family:方正仿宋简体">各学院</span></span><span style="font-family:方正仿宋简体;color:rgb(88,88,88);font-size:21px"><span style="font-family:Times New Roman">:</span></span></p><p style="margin-top:0;margin-bottom:0;text-indent:43px;vertical-align:baseline;background:rgb(255,255,255)"><span style="font-family:方正仿宋简体;color:rgb(88,88,88);font-size:21px"><span style="font-family:方正仿宋简体">根据《教育部关于印发</span><span style="font-family:Times New Roman">&lt;</span><span style="font-family:方正仿宋简体">高等学校学生学籍学历电子注册办法</span><span style="font-family:Times New Roman">&gt;</span><span style="font-family:方正仿宋简体">的通知》（教学〔</span><span style="font-family:Times New Roman">2014</span><span style="font-family:方正仿宋简体">〕</span><span style="font-family:Times New Roman">11</span><span style="font-family:方正仿宋简体">号）</span></span><span style="font-family:方正仿宋简体;color:rgb(88,88,88);font-size:21px"><span style="font-family:方正仿宋简体">等相关</span></span><span style="font-family:方正仿宋简体;color:rgb(88,88,88);font-size:21px"><span style="font-family:方正仿宋简体">规定，为切实做好新生入学学籍电子注册工作，及时发现并消除招生及学籍管理中可能存在的问题和隐患，我处已在教育部规定的时间内完成了</span></span><span style="font-family:方正仿宋简体;color:rgb(88,88,88);font-size:21px"><span style="font-family:Times New Roman">202</span></span><span style="font-family:方正仿宋简体;color:rgb(88,88,88);font-size:21px"><span style="font-family:Times New Roman">6</span></span><span style="font-family:方正仿宋简体;color:rgb(88,88,88);font-size:21px"><span style="font-family:方正仿宋简体">级新生的学籍网上电子注册工作。教育部已于近日开通了</span><span style="font-family:方正仿宋简体">“全国普通高校新生学籍查询系统”，并安排从即日起由各高校组织</span></span><span style="font-family:方正仿宋简体;color:rgb(88,88,88);font-size:21px"><span style="font-family:Times New Roman">202</span></span><span style="font-family:方正仿宋简体;color:rgb(88,88,88);font-size:21px"><span style="font-family:Times New Roman">6</span></span><span style="font-family:方正仿宋简体;color:rgb(88,88,88);font-size:21px"><span style="font-family:方正仿宋简体">级新生实名注册并查询和核实自己的学籍信息。</span></span></p></div></form></body></html>
